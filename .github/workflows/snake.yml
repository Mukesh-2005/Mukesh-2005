name: Generate Contribution Snake

on:
  # refresh every day at 00:00 UTC (05:30 IST)
  schedule:
    - cron: "0 0 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # also run whenever you push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVG from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#00D4FF&color_dots=#161B22,#0E4A5C,#0A6E8A,#05A0C8,#00D4FF

      - name: Push the SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
